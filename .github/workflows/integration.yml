name: Integration

# Runs the scripts in examples/ end to end (tests/integration). They take several
# minutes, so the regular CI skips them (see addopts in pyproject.toml).
on:
  # Pull requests into main from a release-* branch, i.e. before a release merge.
  pull_request:
    branches: [ "main" ]
  # Every Sunday at 10:00 UTC (cron is always UTC).
  schedule:
    - cron: '0 10 * * 0'
  # Manual runs from the Actions tab.
  workflow_dispatch:

# The job runs every script in examples/ and needs nothing but a read of the code.
permissions:
  contents: read

jobs:
  integration:
    name: Examples on ${{ matrix.os }}
    # Pull requests only count when they come from a release branch; schedule
    # and manual runs always go ahead.
    if: github.event_name != 'pull_request' || startsWith(github.head_ref, 'release-')
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
    - uses: actions/checkout@v6
      with:
        persist-credentials: false

    - name: Set up Pixi
      uses: prefix-dev/setup-pixi@v0.10.0
      with:
        cache: true

    - name: Run integration tests
      run: pixi run test-integration
